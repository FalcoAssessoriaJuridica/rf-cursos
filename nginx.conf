server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing — todas as rotas caem no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Service worker e página inicial nunca ficam em cache do navegador: é assim que as atualizações chegam
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Cache longo para assets com hash (gerados pelo Vite)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Cache de ícones e manifest PWA
    location ~* \.(png|ico|json|webmanifest)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Compressão gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;
}
