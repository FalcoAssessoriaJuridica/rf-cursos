<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      try { document.documentElement.dataset.theme = localStorage.getItem('rf_theme') === 'light' ? 'light' : 'dark'; } catch (e) {}
      try { var b = localStorage.getItem('rf_bg'); if (b && b !== 'padrao') document.documentElement.dataset.bg = b; } catch (e) {}
    </script>
    <link rel="icon" type="image/png" href="/logo-rf.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    
    <!-- PWA primary color -->
    <meta name="theme-color" content="#09090b" />
    
    <!-- iOS support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RF Cursos" />
    <link rel="apple-touch-icon" href="/logo-rf.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>RF Cursos - Premium Music Platform</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  
    <!-- FALCO VISUAL STUDIO (Ativo exclusivamente em localhost) -->
    <script>
        if (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1" || window.location.hostname.endsWith(".local") || window.location.search.includes("studio=1")) {
            const studioScript = document.createElement("script");
            studioScript.src = "falco-visual-studio.js";
            document.body.appendChild(studioScript);
        }
    </script>
</body>
</html>
